# Optional artifact isolation root (execution-layer parameter).
# When set, e.g. `artifact_root=artifacts/002/run`, all run artifacts are
# redirected under it: <artifact_root>/checkpoints (incl. wandb files) and
# <artifact_root>/res (predictions/metrics). Stage 2 also resolves a relative
# `predictor.saved_model` against the effective checkpoint dir, so it loads
# Stage 1 checkpoints from the same artifact root.
# null (default) keeps the original project-level checkpoints/ and res/.
artifact_root: null

vqvae:
  num_features: 158
  seq_len: 20 
  hidden_size: 128     
  num_prior_factors: 13  
  vq_embed_dim: 128   
  num_embed: 512    

  encoder:
    num_heads: 2 
    num_layers: 1

  quantizer:
    # type: 'single' 保持 PRISM-VQ 原行为；'hvq' 启用残差式层次化量化（ResidualVectorQuantiser）
    # 本实验（005，基于 004/001）Stage 1 保持与 001 相同的两级 'hvq' 训练方式。
    type: 'hvq'
    num_levels: 2
    level_num_embed: [256, 256]  # 各级 codebook 大小，长度须等于 num_levels
    decay: 0.95
    commit_weight: 0.25
    distance: 'l2'
    anchor: 'probrandom'
    first_batch: False
    contras_loss: True

  decoder:
    norm_type: 'none'
    num_groups: 8
    hidden_channels: 128
    initial_T: 5

  predictor:
    pred_len: 10 
    num_gru_layers: 1
    dropout: 0.1 
    output_dim: 1
    pred_weight: 0.0001

data:
  universe: 'csi300'
  data_path: 'dataset/data'
  # 预处理 pickle 所在目录；默认复用 PRISM-VQ 已生成的数据，避免重复处理 9GB 数据
  pickle_dir: '../PRISM-VQ/dataset/data'
  window_size: 20
  step: 1
  train_period : ["2009-01-01", "2020-12-31"]  # 12 years
  valid_period : ["2021-01-01", "2022-12-31"]  # 2 years
  test_period  : ["2023-01-01", "2025-12-31"]  # 3 years

stage2_presets:
  csi300:
    predictor:
      # Stage 1 训练完成后在此填写生成的 checkpoint 文件名（checkpoints/ 目录下）
      saved_model: "hvq_csi300_full-epoch=5-val_loss=0.4592.ckpt"
      aux_weight: 0.01
      n_expert: 2
      transformer:
        num_heads: 2
  sp500:
    predictor:
      # Stage 1 训练完成后在此填写生成的 checkpoint 文件名（checkpoints/ 目录下）
      saved_model: ""
      aux_weight: 0.001
      n_expert: 8
      transformer:
        num_heads: 4

predictor: 
  # Stage 1 训练完成后在此（或 stage2_presets）填写生成的 checkpoint 文件名
  saved_model: ""
  num_features: 158
  individual: False
  aux_weight: 0.01

  kernel_size: 3
  k: ${half:${predictor.n_expert}} 
  n_expert: 2
  pred_len: 20  
  moe_hidden: 64 
  dropout: 0.1

  transformer:
    pe_kind: 'rope'
    num_heads: 2
    num_layers: 1
    d_model: 64   
    dim_feedforward: 128
    dropout: 0.1 
    batch_first: True
    prepend_structure_token: True
 
  rank : 0
  target_day: 5
  use_prior: True
  aux_imp: 3
  # 005 实验核心开关：Stage 2 两级融合由 004 的全局单标量 alpha 改为
  # sample-wise adaptive gate：z_i = z0_i + g_i * z1_i，
  # g_i = sigmoid(Linear(concat(z0_i, z1_i)))，每个样本独立标量，范围 [0,1]。
  # gate 输入仅用 Stage 1 已产生的 z0/z1（detach），不引入额外信息。
  # 默认 true 即本实验本身；设为 false 回退到 001 的 z0+z1 固定融合行为。
  samplewise_z1_gate: true
  # gate Linear 的初始化：weight 全零，bias = 3.0，因此所有样本初始
  # g_i = sigmoid(3.0) ≈ 0.9526，与 004 的 alpha_init = sigmoid(3.0) 完全一致。
  z1_gate_bias_init: 3.0
  
train:
  seed: 0 # 
  device: "cuda"
  batch_size: 300 
  learning_rate: 0.0001 
  num_epochs: 70
  project_name: "PRISM-VQ"
  run_name: "auto"
  gpu_counts: 1
  precision: 32 
  num_workers: 4
  gradient_clip_val: 1
  save_dir: "checkpoints"
  save_res: "res"
  early_stopping:
    monitor: "val_loss"
    min_delta: 0.00001
    patience: 15
    verbose: True
    mode: "min"
