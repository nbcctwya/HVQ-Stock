# AlphaMaster temporal-market experiment under the canonical dataset/protocol.
# artifact_root is an execution-layer override used by experiments/runner.py.
artifact_root: null

alphamaster:
  d_feat: 158
  d_market: 63
  d_model: 256
  t_nhead: 4
  s_nhead: 2
  T_dropout_rate: 0.5
  S_dropout_rate: 0.5
  market_encoder:
    type: gru
    input_size: 63
    hidden_size: 63
    num_layers: 1
  beta:
    csi300: 10
    sp500: 5

data:
  universe: csi300
  data_path: dataset/processed
  window_size: 20
  return_horizon: 10
  step: 1
  train_period: ["2009-01-01", "2020-12-31"]
  valid_period: ["2021-01-01", "2022-12-31"]
  test_period: ["2023-01-01", "2025-12-31"]

predictor:
  # "auto" supports direct stage1.py -> stage2.py use. The Phase 2 runner
  # supplies the exact discovered Stage 1 checkpoint filename explicitly.
  saved_model: auto
  target_day: 5

train:
  # Stage 1 remains fixed at seed 42 in stage1.py; Stage 2 uses protocol seed 0.
  seed: 0
  learning_rate: 0.000008
  num_epochs: 70
  project_name: AlphaMaster
  run_name: auto
  accelerator: gpu
  gpu_counts: 1
  precision: 32
  num_workers: 4
  gradient_clip_val: 3.0
  log_every_n_steps: 50
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  save_dir: checkpoints
  save_res: res
  early_stopping:
    monitor: val_loss
    min_delta: 0.00001
    patience: 15
    verbose: true
    mode: min
