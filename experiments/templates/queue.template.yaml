# Template for experiments/queue.yaml
#
# Copy this structure when maintaining the real queue.yaml.
#
# Field specification:
#   id      : three-digit string, zero-padded, e.g. "004".
#             New id = max(existing ids) + 1. Ids are never reused,
#             even for failed experiments.
#   name    : short, readable kebab-case name derived from the idea.
#   branch  : always "exp/<id>-<name>", e.g. exp/004-market-gated-z1.
#   status  : exactly one of:
#               pending  - code complete, smoke PASS, ready for training
#               running  - being executed by the stage-2 executor
#               done     - finished, metrics written to the record
#               failed   - execution failed; id and record are kept
#
# Ordering: entries are sorted by id ascending.
# Mutation: append-only for new experiments; only `status` may be
# updated on existing entries.

experiments:
  - id: "000"
    name: example-entry
    branch: exp/000-example-entry
    status: pending
