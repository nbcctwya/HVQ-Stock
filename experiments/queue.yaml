# Experiment queue — real queue consumed by the stage-2 executor.
#
# Rules (see templates/RULES.md for the full specification):
#   - Experiments are sorted by id (ascending).
#   - New experiments are appended only; ids are never renumbered or reused.
#   - An experiment may enter this queue only after code development is
#     complete and its smoke test has PASSED.
#   - New entries always start with status: pending.
#   - status is one of: pending | running | done | failed
#
# Entry format:
#   - id: "004"                          # three-digit string
#     name: market-gated-z1              # kebab-case
#     base: main                         # base branch (default main)
#     branch: exp/004-market-gated-z1
#     status: pending
#     stage1_source: self                # optional; an experiment id reuses
#                                        # that experiment's stage1 checkpoint

experiments:
  - id: "001"
    name: hvq-residual-2level
    base: main
    branch: exp/001-hvq-residual-2level
    status: done
  - id: "002"
    name: prior-gated-fusion
    base: main
    branch: exp/002-prior-gated-fusion
    status: done
  - id: "003"
    name: hvq-z0-only
    base: exp/001-hvq-residual-2level
    branch: exp/003-hvq-z0-only
    status: done
